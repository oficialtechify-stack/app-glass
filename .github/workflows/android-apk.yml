name: Android APK and Updates

on:
  push:
    branches: [main]
    paths-ignore:
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Validate Kotlin and unit tests
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ai-glass-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Prepare downloadable APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ai-glass-os.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/ai-glass-os.apk --title "AI Glass OS $TAG" --notes "Atualização automática do AI Glass OS. Instale por cima da versão anterior se a assinatura for compatível." --latest
