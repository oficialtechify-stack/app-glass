name: Android APK and Updates

on:
  push:
    branches: [main]
    paths-ignore:
      - 'api/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Assinatura estável em TODOS os steps: as vars precisam existir já na
    # PRIMEIRA configuração do Gradle. Antes elas só existiam no step de
    # build — mas o step "Validate" roda o Gradle antes, sem elas, e o
    # configuration-cache (org.gradle.configuration-cache=true) gravava a
    # configuração com o debug keystore padrão; o assemble reutilizava o
    # cache e a v1.0-49 saiu com uma terceira assinatura (07/11/2026).
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/smartglass-signing.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android 37 platform (dev channel)
        # compileSdk 37: a plataforma android-37.0 ainda não está no canal
        # estável do SDK (só no Dev, --channel=2). Sem este passo o CI
        # falha no checkDebugAarMetadata como o build local falhava antes.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=2 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Restore stable signing key
        # Keystore estável (alias smartglass) guardado nos secrets do repo.
        # Sem ele, cada runner gera um debug keystore novo e cada release
        # sai com uma assinatura diferente — o Android bloqueia o update
        # por cima (v1.0-37 → v1.0-47, 07/11/2026). Se o secret faltar,
        # o build falha aqui em vez de assinar com chave errada.
        # Roda ANTES do Validate: o keystore precisa existir antes da
        # primeira configuração do Gradle (ver o env do job acima).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/smartglass-signing.jks
      - name: Validate Kotlin and unit tests
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        # --no-configuration-cache: cinto e suspensórios contra o bug da
        # v1.0-49 — nenhuma configuração em cache pode reutilizar o
        # signingConfig sem o keystore estável.
        run: gradle :app:assembleDebug --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ai-glass-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Prepare downloadable APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ai-glass-os.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/ai-glass-os.apk --title "AI Glass OS $TAG" --notes "Atualização automática do AI Glass OS. Instale por cima da versão anterior se a assinatura for compatível." --latest
